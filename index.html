<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="htm introduction">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th># order</th>
                <th>name</th>
                <th>coffee type</th>
                <th>take away</th>
                <th>price</th>
            </tr>
        </thead>
        <tbody id="tbodyId">

        </tbody>
    </table>
    <form id="formId">
        <label>name:
            <input type="text" required name="name" placeholder="enter name" pattern="[A-Z][a-z]{2,10}">
        </label>
        <label>coffee type:
            <select name="coffeeType" required>
                <option value="" selected>--select coffee type--</option>
                <option value=americano>americano</option>
                <option value=capuchino>capuchino</option>
                <option value=espresso>espresso</option>
            </select>
        </label>
        <label>take away:
            <input type="checkbox" name="takeAway">
        </label>
        <label>price:
            <input type="number" required name="price" min="8" max="20" placeholder="enter price">
        </label>
        <button type="submit">save</button>
        <button type="reset">reset</button>
    </form>
    <script src="src/main.js"></script>
</body>

</html>
