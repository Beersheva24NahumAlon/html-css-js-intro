<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="htm introduction">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>department</th>
                <th>salary</th>
            </tr>
        </thead>
        <tbody id="tbodyId">

        </tbody>
    </table>
    <form id="formId">
        <label>name:
            <input type="text" required name="name" placeholder="enter name" pattern="[A-Z][a-z]{2,10}">
        </label>
        <label>department:
            <select name="department" required>
                <option value="" selected>--select department--</option>
                <option value=QA>QA</option>
                <option value=Audit>Audit</option>
                <option value=Menegment>Menegment</option>
            </select>
        </label>
        <label>salary:
            <input type="number" required name="salary" min="5000" max="50000" placeholder="enter salay">
        </label>
        <button type="submit">save</button>
        <button type="reset">reset</button>
    </form>
    <script src="src/main.js"></script>
</body>

</html>
